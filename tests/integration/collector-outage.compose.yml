services:
  tempo:
    image: grafana/tempo:2.7.1
    command: ['-config.file=/etc/tempo/tempo.yaml']
    ports:
      - '127.0.0.1::3200'
    volumes:
      - ../../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://localhost:3200/ready']
      interval: 5s
      timeout: 3s
      retries: 12
  loki:
    image: grafana/loki:3.4.2
    command: ['-config.file=/etc/loki/config.yaml']
    ports:
      - '127.0.0.1::3100'
    volumes:
      - ../../observability/loki/config.yaml:/etc/loki/config.yaml:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://localhost:3100/ready']
      interval: 5s
      timeout: 3s
      retries: 12
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    ports:
      - '127.0.0.1:${OUTAGE_OTLP_PORT:?}:4318'
      - '127.0.0.1:${OUTAGE_HEALTH_PORT:?}:13133'
    volumes:
      - ../../observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
