global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: observability-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3103']

  - job_name: sales-event-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']
        labels:
          service: sales-event-api
          environment: development
    metric_relabel_configs:
      - source_labels: [path]
        target_label: route

  - job_name: sales-event-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9091']
        labels:
          service: sales-event-worker
          environment: development

  - job_name: sales-event-email-retry-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['email-retry-worker:9092']
        labels:
          service: sales-event-email-retry-worker
          environment: development
