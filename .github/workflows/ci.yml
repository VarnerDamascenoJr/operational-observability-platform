name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Validate observability configuration
        run: npm run validate:observability

      - name: Start observability stack
        run: docker compose up -d --wait

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://observability:observability@localhost:5432/observability

      - name: Run observability smoke test
        run: npm run smoke:observability

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop observability stack
        if: always()
        run: docker compose down --volumes
